    <p>ZUTOMAYO</p>
    <div id="slideshow-container">
<img id="slide-image" src="images/mainimages.jpg" alt="メインの写真">
<button id="prev-btn"></button>
<button id="next-btn"></button>
</div>
<script>
const images = ['images/mainimages.jpg', 'images/mainimages1.jpg', 'images/mainimages2.jpg','images/mainimages3.jpg'];
let currentImageIndex = 0; // 現在の画像のインデックス
const slideImage = document.getElementById('slide-image');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

function showImage(index) {
  if (index >= 0 && index < images.length) {
    slideImage.src = images[index];
    currentImageIndex = index;
  }
}

nextBtn.addEventListener('click', () => {
  showImage((currentImageIndex + 1) % images.length); // 次の画像へ（ループ）
});

prevBtn.addEventListener('click', () => {
  showImage((currentImageIndex - 1 + images.length) % images.length); // 前の画像へ（ループ）
});
setInterval(() => {
  showImage((currentImageIndex + 1) % images.length);
}, 3000); // 3秒ごとに自動で切り替え

</script>
